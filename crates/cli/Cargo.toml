[package]
name = "locrin"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Locrin: the deterministic quality gate for code written by people and agents"
readme = "../../README.md"

[[bin]]
name = "locrin"
path = "src/main.rs"

[dependencies]
locrin-core = { path = "../core", version = "0.6.1" }
locrin-rules = { path = "../rules", version = "0.6.1" }
locrin-reporters = { path = "../reporters", version = "0.6.1" }
locrin-mcp = { path = "../mcp", version = "0.6.1" }
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true }
serde_json.workspace = true
rayon.workspace = true

[dev-dependencies]
assert_cmd = "2"
rusqlite = { workspace = true }
tempfile = "3"
