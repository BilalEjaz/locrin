name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: bash scripts/tests/run.sh
      - run: bash scripts/check-versions.sh
      - run: bash scripts/check-private-refs.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          LOCRIN_HOOK_BUDGET_MS: "10000"

  action-smoke:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p locrin && echo "$PWD/target/release" >> "$GITHUB_PATH"
      - id: gate
        uses: ./action
        with:
          version: local
          path: crates/cli/tests/fixtures/repo
          # The fixture is not touched by this pull request, so a merge-base diff
          # would select no files. Empty base means check every fixture file.
          base: ""
          comment: "false"
          sarif: "false"
          offline: "true"
          fail-on-block: "false"
      - name: The fixture must block
        run: |
          test "${{ steps.gate.outputs.status }}" = "block"
          test "${{ steps.gate.outputs.exit-code }}" = "1"
          grep -q '<!-- locrin-report -->' "${{ steps.gate.outputs.comment-file }}"
          python3 -c "import json,sys; d=json.load(open('${{ steps.gate.outputs.sarif-file }}')); assert d['version']=='2.1.0' and len(d['runs'][0]['results'])>=2"

  install-smoke:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            npm: linux-x64
            pypi: manylinux_2_35_x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            npm: darwin-arm64
            pypi: macosx_11_0_arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            npm: win32-x64
            pypi: win_amd64
    runs-on: ${{ matrix.os }}
    # bash everywhere, so one command spelling covers all three runners.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release -p locrin
      # The shell expands the glob, so this spelling works on every Node version:
      # --test takes a directory on some and a glob on others, but always files.
      - run: node --test npm/locrin/test/*.test.js
      - run: python -m unittest discover -s pypi -p "test_*.py"
      - run: bash scripts/ci/install-smoke.sh '${{ matrix.target }}' '${{ matrix.npm }}' '${{ matrix.pypi }}'
