name: tmp-release-verify

# TEMPORARY. Verbatim copy of the `build` job in release.yml, triggered by a push
# to engine/ci so the matrix can be proven before release.yml reaches the default
# branch (workflow_dispatch only works for workflows present on the default
# branch). Deleted again in the follow-up commit; the `publish` job is left out
# on purpose so no release or tag can be created.

on:
  push:
    branches: [engine/ci]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "tag $tag does not match Cargo.toml version $version" >&2
              exit 1
            fi
          else
            tag="v$version-dryrun"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p locrin-cli --target ${{ matrix.target }}
      - name: Package
        id: pkg
        shell: bash
        run: |
          tag='${{ steps.tag.outputs.tag }}'
          name="locrin-${tag}-${{ matrix.target }}"
          mkdir -p dist/"$name"
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            cp target/${{ matrix.target }}/release/locrin.exe dist/"$name"/
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
            asset="dist/$name.zip"
          else
            cp target/${{ matrix.target }}/release/locrin dist/"$name"/
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            asset="dist/$name.tar.gz"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.pkg.outputs.asset }}
          if-no-files-found: error
