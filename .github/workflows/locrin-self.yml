name: locrin-self

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  locrin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p locrin-cli && echo "$PWD/target/release" >> "$GITHUB_PATH"
      - uses: ./action
        with:
          version: local
          path: crates/cli/tests/fixtures/repo
          # The fixture is untouched by this pull request, so a merge-base diff
          # would select no files. Empty base means check every fixture file.
          base: ""
          comment: "true"
          sarif: "false"
          offline: "true"
          fail-on-block: "false"
