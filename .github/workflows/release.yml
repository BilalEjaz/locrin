name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and upload workflow artifacts without creating a release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "tag $tag does not match Cargo.toml version $version" >&2
              exit 1
            fi
          else
            tag="v$version-dryrun"
          fi
          if [[ "${{ inputs.dry-run }}" == "true" && "$tag" != *-dryrun ]]; then
            tag="$tag-dryrun"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p locrin --target ${{ matrix.target }}
      - name: Package
        id: pkg
        shell: bash
        run: |
          asset=$(bash scripts/package.sh '${{ matrix.target }}' '${{ steps.tag.outputs.tag }}' 'target/${{ matrix.target }}/release' dist)
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.pkg.outputs.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry-run == false) }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets && sha256sum locrin-* > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/tags/* ]] || { echo "not a tag ref" >&2; exit 1; }
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --title "locrin $tag" --generate-notes
