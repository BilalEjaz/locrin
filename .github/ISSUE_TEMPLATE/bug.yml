name: Bug
description: A crash, a wrong verdict, a hook or Action problem.
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: "Locrin version and platform", placeholder: "locrin 0.6.1, macOS arm64" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: "Steps to reproduce" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: "Expected and actual" }
    validations: { required: true }
