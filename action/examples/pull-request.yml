name: locrin
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  security-events: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BilalEjaz/locrin/action@v0.6.0
        with:
          version: v0.6.0
