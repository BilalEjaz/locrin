# Copy to fasting-app/.github/workflows/locrin.yml. Requires the locrin wiring
# (locrin.toml, locrin-baseline.json) committed. Needs fetch-depth 0 for --base.
# While the locrin repository is private, LOCRIN_TOKEN must be a fine-grained PAT
# with Contents read on BilalEjaz/locrin; drop the token line once locrin is public.
name: locrin
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  security-events: write
jobs:
  locrin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BilalEjaz/locrin/action@v0.3.0
        with:
          token: ${{ secrets.LOCRIN_TOKEN }}
